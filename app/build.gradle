plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goffcomputer.fieldnet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.goffcomputer.fieldnet'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Same key every build, so a new APK installs over the old one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
